<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Meta Pixel TheBewerbung+ : à ajouter ici -->
<title>TheBewerbung+</title>
<meta name="description" content="Bewerbung professionnelle : Deckblatt, Lebenslauf et Motivationsschreiben en allemand, livrés en moins de 24 h.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='17' y='10' width='30' height='40' rx='4' fill='%23fff' stroke='%231c2f5c' stroke-width='4'/%3E%3Ccircle cx='46' cy='46' r='12' fill='%2322a35a'/%3E%3Cpath d='M40 46l4 4 8-8' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* TheBewerbung+ : its own page. Dark navy hero with the order form, then proof (Instagram comments), the three documents, the Deckblatt explainer, the 5 mistakes, 3 steps, price + payment, FAQ. German flag stripes and the green "validated" check from the logo as accents. */
:root{
  --bg:#ffffff; --bg2:#f4f6fa; --surface:#ffffff; --fg:#121c33; --muted:#5a6579; --line:#e1e6ef;
  --brand:#1c2f5c; --brand-fg:#ffffff; --accent:#1f8f50; --soft:#e7f5ed; --gold:#f0b429; --red:#d42a2a;
  --wa:#1b9e50; --wa-fg:#ffffff; --hero:#101a36; --hero-fg:#f3f5fa; --hero-muted:#b4bed3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --bg2:#0f172b; --surface:#141e36; --fg:#ecf0f7; --muted:#a3aec4; --line:#24304d;
  --brand:#4a6dbd; --brand-fg:#ffffff; --accent:#41c27d; --soft:#14301f; --gold:#f2bf47; --red:#ef5a5a;
  --wa:#34c473; --wa-fg:#04210f; --hero:#070c18; --hero-fg:#eef1f8; --hero-muted:#a3aec4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --bg2:#0f172b; --surface:#141e36; --fg:#ecf0f7; --muted:#a3aec4; --line:#24304d;
  --brand:#4a6dbd; --brand-fg:#ffffff; --accent:#41c27d; --soft:#14301f; --gold:#f2bf47; --red:#ef5a5a;
  --wa:#34c473; --wa-fg:#04210f; --hero:#070c18; --hero-fg:#eef1f8; --hero-muted:#a3aec4; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans","Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[lang="ar"] body{font-family:"Tajawal","Plus Jakarta Sans",system-ui,sans-serif;font-size:17px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.02em;font-weight:800}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.45;letter-spacing:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto}
.full{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.flag{height:5px;display:flex;direction:ltr}.flag i{flex:1}.flag i:nth-child(1){background:#16181d}.flag i:nth-child(2){background:#d42a2a}.flag i:nth-child(3){background:#f0b429}
.stripe{background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.85em 1.4em;border-radius:999px;font-weight:800;text-decoration:none;border:2px solid transparent;font-size:1rem;cursor:pointer;font-family:inherit}
.btn svg{width:1.25em;height:1.25em;fill:currentColor;flex:none}
.btn-wa{background:var(--wa);color:var(--wa-fg)}
.btn-main{background:var(--brand);color:var(--brand-fg)}
.btn-ghost{border-color:rgba(255,255,255,.35);color:#fff;background:transparent}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.pill:focus-visible,summary:focus-visible,details a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.logo{display:inline-flex;align-items:center;gap:10px;direction:ltr;text-decoration:none;color:var(--fg)}
.logo svg{width:44px;height:44px;flex:none}
.logo .wm{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:1.18rem;letter-spacing:-.02em;line-height:1}
.logo .wm b{color:var(--brand)}.logo .wm span{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .wm b{color:#fff}}
:root[data-theme="dark"] .logo .wm b{color:#fff}
header.bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.acts{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:.45em .95em;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
.bar .btn{padding:.5em 1em;font-size:.92rem}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;padding-block:54px 64px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 14px;font-weight:800;font-size:.86rem;color:#fff;margin-bottom:18px}
.badge .mini{display:inline-flex;width:20px;height:13px;border-radius:2px;overflow:hidden;flex-direction:column}
.badge .mini i{flex:1}.badge .mini i:nth-child(1){background:#16181d}.badge .mini i:nth-child(2){background:#d42a2a}.badge .mini i:nth-child(3){background:#f0b429}
.hero h1{font-size:clamp(2.3rem,6vw,4rem)}
html[lang="fr"] .hero h1{font-size:clamp(2rem,5vw,3.3rem)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{color:var(--hero-muted);font-size:1.12rem;margin-top:16px;max-width:52ch}
.chips{display:grid;gap:10px;margin-top:26px}
.chip{display:flex;align-items:center;gap:12px;font-weight:700}
.chip .ic{width:38px;height:38px;border-radius:12px;background:rgba(65,194,125,.16);color:#5fd394;display:grid;place-items:center;flex:none}
.chip .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.proof{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);flex-wrap:wrap}
.proof .stars{color:var(--gold);letter-spacing:2px;font-size:1.1rem}
.proof a{color:var(--hero-fg);font-weight:700;text-underline-offset:4px}

/* order form */
.leadform{background:var(--surface);color:var(--fg);border-radius:22px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
.leadform::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}
.lf-h{font-size:1.45rem;margin-bottom:2px}
.lf-p{color:var(--muted);font-size:.95rem;margin-bottom:16px}
.leadform form{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld label,.fld .lb{font-weight:700;font-size:.9rem}
.r{color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.65em .85em;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:.4em 1em;cursor:pointer;font-weight:700}
.opt input{accent-color:var(--accent)}
.nocv{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;background:var(--soft);border-radius:12px;padding:12px 14px}.nocv input{width:20px;height:20px;accent-color:var(--accent)}
#nocvBox{display:grid;gap:12px;border:1px dashed var(--line);border-radius:14px;padding:14px}#nocvBox[hidden]{display:none}
#nocvBox textarea{resize:vertical;min-height:84px}
.err{color:var(--red);font-weight:700;font-size:.9rem;min-height:1.1em}
.btn-big{width:100%;padding:1em 1.2em;font-size:1.05rem;border-radius:14px}
.bad{border-color:var(--red) !important;box-shadow:0 0 0 2px rgba(212,42,42,.2)}
.minirevs{display:grid;gap:10px;margin:4px 0 2px}
.mr{margin:0;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.mr .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800}
.mr .st{color:var(--gold);letter-spacing:2px;font-size:.9rem;line-height:1}
.mr blockquote{margin:5px 0;font-size:.92rem;line-height:1.55}
.mr figcaption{font-size:.8rem;color:var(--muted);font-weight:700;direction:ltr;text-align:start}
.reassure{margin:10px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-weight:700;font-size:.84rem;color:var(--accent)}
.reassure span{padding:8px 13px;background:var(--soft);border-radius:999px;white-space:nowrap}
.done{display:none;text-align:center}.done.on{display:block}.done h3{margin-bottom:8px}
.prev{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.86rem;margin:14px 0;overflow:auto;max-height:220px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
@media (prefers-reduced-motion:no-preference){@keyframes ready{0%,100%{box-shadow:0 0 0 0 rgba(27,158,80,.55)}50%{box-shadow:0 0 0 12px rgba(27,158,80,0)}}#send.ready{animation:ready 1.6s ease-out infinite}}


.dic{width:64px;height:64px;border-radius:18px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.dic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dlist li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.05rem;padding:14px 16px;border:1px solid rgba(255,255,255,.14);border-radius:14px}
.dlist li::before{content:"\2713";display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#22a35a;color:#fff;font-size:.85rem;flex:none}
.hprice{display:inline-flex;align-items:center;gap:16px;margin-top:24px;background:var(--gold);color:#13233a;border-radius:20px;padding:12px 22px 12px 16px;box-shadow:0 14px 34px rgba(240,180,41,.25)}
.hp-amt{font:800 clamp(3rem,8vw,4.4rem)/1 "Plus Jakarta Sans",sans-serif;direction:ltr;letter-spacing:-.03em}
.hp-txt{display:grid;line-height:1.3}.hp-txt b{font-size:1.3rem;font-weight:800}.hp-txt small{font-weight:700;font-size:.92rem;opacity:.8}
/* sections */
section.s{padding-block:72px}
section.alt{background:var(--bg2)}
.eyebrow{display:inline-block;font-weight:800;font-size:.85rem;color:var(--accent);margin-bottom:8px;letter-spacing:.02em}
.h2{font-size:clamp(1.8rem,3.8vw,2.6rem)}
.h2 em{font-style:normal;color:var(--brand);box-shadow:inset 0 -.38em 0 rgba(240,180,41,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h2 em{color:var(--gold);box-shadow:none}}
:root[data-theme="dark"] .h2 em{color:var(--gold);box-shadow:none}
.sub{color:var(--muted);margin-top:10px;max-width:62ch}
.head-c{text-align:center}.head-c .sub{margin-inline:auto}

/* Instagram comments wall */
.wall{columns:3 280px;column-gap:16px;margin-top:34px}
.ig{break-inside:avoid;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.ig .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;direction:ltr}
.ig .av{width:36px;height:36px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f0b429,#d42a2a,#8a3ab9);flex:none}
.ig .av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surface);font-weight:800;font-size:.9rem;color:var(--fg)}
.ig .u{font-weight:800;font-size:.9rem}
.ig .src{margin-left:auto;color:var(--muted);display:flex}
.ig .src svg{width:18px;height:18px;fill:currentColor}
.ig p{font-size:1rem;line-height:1.7}
.ig .t{margin-top:10px;font-size:.8rem;color:var(--muted);font-weight:700}
.wall-cta{text-align:center;margin-top:10px}
.wall-cta a{color:var(--brand);font-weight:800;text-underline-offset:4px}

/* documents */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.doc{border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;background:var(--surface)}
.mock{background:linear-gradient(160deg,#1c2f5c,#101a36);border-radius:14px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;direction:ltr}
.page{width:46%;aspect-ratio:1/1.414;background:#fff;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.35);position:relative;overflow:hidden;padding:8%;color:#1c2f5c;transform:rotate(-2deg)}
.page::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}
.page .t{font:800 9px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.06em;text-align:center}
.page .ln{height:3px;border-radius:2px;background:#d6e0ea;margin:5px 0}
.page .ln.s{width:60%}
.page .ph{width:44%;aspect-ratio:3/4;margin:8px auto;border-radius:3px;background:linear-gradient(#cfdbe7,#e6edf4);position:relative}
.page .ph::after{content:"";position:absolute;left:30%;right:30%;top:22%;aspect-ratio:1;border-radius:50%;background:#9fb3c7;box-shadow:0 22px 0 8px #9fb3c7}
.page.cv{padding:0}
.page.cv .side{position:absolute;inset:0 auto 0 0;width:34%;background:#1c2f5c;padding:10% 6%}
.page.cv .side .av{width:70%;aspect-ratio:1;border-radius:50%;background:#9fb3c7;border:2px solid #fff;margin:0 auto 8px}
.page.cv .side .ln{background:#3e6890}
.page.cv .col{position:absolute;left:40%;right:8%;top:10%}
.page.cv .col .h{height:5px;width:55%;background:#1c2f5c;border-radius:2px;margin:8px 0 6px}
.doc .tg{justify-self:start;font:800 .8rem "Plus Jakarta Sans",sans-serif;color:var(--accent);direction:ltr}
.doc h3{font-size:1.22rem}
.doc p{color:var(--muted);font-size:.97rem}

/* deckblatt */
.deck .sub{max-width:70ch}
.deck .why{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.deck .why{grid-template-columns:1fr}}
.deck-vis{background:var(--hero);color:#fff;border-radius:24px;padding:72px 30px 34px;position:relative;overflow:hidden}
.deck-vis .tag{position:absolute;top:26px;inset-inline-start:30px;background:var(--gold);color:#13233a;font:800 .9rem "Plus Jakarta Sans",sans-serif;padding:6px 14px;border-radius:999px}
.why{display:grid;gap:12px;margin-top:24px}
.why .w{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.why .w .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;grid-row:span 2}
.why .w b{font-weight:800}
.why .w small{color:var(--muted);font-size:.93rem}

/* mistakes */
.mist{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:32px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px;align-content:start;position:relative}
.m .k{font:800 2rem/1 "Plus Jakarta Sans",sans-serif;color:rgba(212,42,42,.22)}
.m b{font-size:1.02rem;line-height:1.4}
.m small{color:var(--muted);font-size:.92rem;line-height:1.55}
.fix{margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:16px 18px;font-weight:800}
.fix::before{content:"\2713";display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;flex:none}

/* steps */
.tl{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:st;position:relative}
.tl li{counter-increment:st;position:relative;padding-top:58px}
.tl li::before{content:counter(st);position:absolute;top:0;inset-inline-start:0;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--gold);color:#13233a;font:800 1.15rem "Plus Jakarta Sans",sans-serif;z-index:1}
.tl li::after{content:"";position:absolute;top:21px;inset-inline-start:52px;inset-inline-end:-14px;height:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl h3{font-size:1.15rem;margin-bottom:4px}
.tl p{color:var(--muted);font-size:.96rem}

/* price */
.pricebox{display:grid;grid-template-columns:.8fr 1.2fr;gap:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pcard{background:var(--hero);color:#fff;padding:36px 24px;text-align:center;display:grid;gap:6px;justify-items:center;align-content:center;position:relative}
.pcard::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}
.pcard .lbl{color:var(--hero-muted);font-weight:700}
.pcard .amt{font:800 5rem/1 "Plus Jakarta Sans",sans-serif;direction:ltr;color:var(--gold)}
.pcard .unit{font-weight:700;margin-bottom:14px}
.pinfo{padding:34px}
.plist{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px;font-weight:700}
.plist li{display:flex;gap:10px;align-items:flex-start}
.plist li::before{content:"\2713";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:.8rem;flex:none;margin-top:2px}
.pay{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.pay b{display:block;margin-bottom:8px}
.pay .pm{display:flex;flex-wrap:wrap;gap:8px}
.pay .pm span{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.9rem;background:var(--bg2)}

/* faq */
.faqgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:start}
.faq{display:grid;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 18px}
summary{cursor:pointer;padding:16px 0;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1;font-weight:800}
details[open] summary::after{content:"\2212"}
details p{color:var(--muted);padding-bottom:12px}
details a{display:inline-block;margin-bottom:16px;color:var(--wa);font-weight:800}

/* final */
.final{background:var(--hero);color:#fff;border-radius:28px;padding:52px 24px;text-align:center;margin-block:8px 70px;position:relative;overflow:hidden}
.final::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#16181d 0 33.3%,#d42a2a 33.3% 66.6%,#f0b429 66.6%)}
.final h2{font-size:clamp(1.8rem,4vw,2.7rem)}
.final h2 em{font-style:normal;color:var(--gold)}
.final p{margin:12px auto 0;max-width:52ch;color:var(--hero-muted)}
.final .cta-row{justify-content:center}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800;color:#fff}
.soc{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.soc a{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);padding:.6em 1.1em;border-radius:999px;text-decoration:none;font-weight:700}
.soc svg{width:20px;height:20px;fill:currentColor}
footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:.88rem}

function buildMessage(){
  var t=document.querySelector('input[name=f_type]:checked'), f=isForm();
  var BAR=new Array(25).join("=");
  var L=["```\u{1F1E9}\u{1F1EA} DOSSIER BEWERBUNG \u{1F1E9}\u{1F1EA}",BAR+"```","",
    "\u{1F464} CANDIDAT(E) :","",
    "Prénom : "+v("f_first"),"Nom : "+v("f_last"),"Ville : "+v("f_city"),"E-mail : "+v("f_mail"),
    "Niveau d'allemand : "+v("f_de"),"",
    "\u{1F3AF} OBJECTIF :","",
    "Je cherche : "+(t?t.value:""),
    (f?"Formation visée : ":"Poste visé : ")+v("f_job")];
  function items(id){return v(id).split("\n").map(function(x){return x.trim()}).filter(Boolean)}
  if($("f_nocv").checked){
    var blocks=[];
    var contact=[]; if(v("n_phone")) contact.push("Téléphone : "+v("n_phone")); if(v("n_birth")) contact.push("Date de naissance : "+v("n_birth")); if(v("n_addr")) contact.push("Adresse : "+v("n_addr"));
    if(contact.length) blocks.push(["COORDONNÉES :",contact]);
    [["ÉTUDES ET DIPLÔMES :","n_edu"],["COURS DE LANGUE :","n_course"],["EXPÉRIENCES PROFESSIONNELLES :","n_exp"],["CERTIFICATS ET EXAMENS :","n_cert"],["LANGUES :","n_lang"],["PERMIS DE CONDUIRE :","n_perm"],["COMPÉTENCES :","n_skills"],["CENTRES D'INTÉRÊT :","n_hob"],["MOTIVATION :","n_why"]].forEach(function(p){
      var it=items(p[1]); if(it.length) blocks.push([p[0],it.length>1?it.map(function(x){return "• "+x}):it]);
    });
    if(blocks.length){
      L.push("","\u{1F4CB} INFORMATIONS :");
      blocks.forEach(function(b){ L.push("",b[0],""); b[1].forEach(function(x){L.push(x)}); });
    }
  }
  return L.join("\n");
}
function revNode(r,cls){
  var f=document.createElement("figure"); f.className=cls;
  var top=document.createElement("div"); top.className="top";
  var av=document.createElement("span"); av.className="av"; var i=document.createElement("span"); i.textContent=r.u.charAt(0).toUpperCase(); av.appendChild(i);
  var u=document.createElement("span"); u.className="u"; u.textContent=r.u;
  var src=document.createElement("span"); src.className="src"; src.innerHTML='<svg viewBox="0 0 24 24"><use href="#igi"/></svg>';
  top.appendChild(av); top.appendChild(u); top.appendChild(src);
  var p=document.createElement("p"); p.textContent=r.t; p.dir="auto";
  f.appendChild(top); f.appendChild(p); return f;
}
function apply(){

  document.querySelectorAll("[data-t-ph]").forEach(function(el){var k=el.getAttribute("data-t-ph"); if(d[k]!==undefined) el.placeholder=d[k]});
  $("lang").textContent = lang==="ar"?"Français":"العربية";

    var f=document.createElement("figure"); f.className="mr";
    var av=document.createElement("span"); av.className="av"; av.textContent=r.u.charAt(0).toUpperCase();
    var b=document.createElement("div");
    var st=document.createElement("div"); st.className="st"; st.textContent="★★★★★";
    var q=document.createElement("blockquote"); q.textContent=r.t; q.dir="auto";
    var w=document.createElement("figcaption"); w.textContent="@"+r.u+" · Instagram";
    b.appendChild(st); b.appendChild(q); b.appendChild(w); f.appendChild(av); f.appendChild(b); mb.appendChild(f);});
  var wall=$("wall"); if(!wall.childNodes.length){ REVIEWS.forEach(function(r){ wall.appendChild(revNode(r,"ig")); }); }

$("lang").addEventListener("click",function(){lang=lang==="ar"?"fr":"ar"; try{localStorage.setItem("tbp-lang",lang)}catch(e){} apply()});
function mark(el,bad){ if(el) el.classList.toggle("bad",!!bad); }
$("order").addEventListener("submit",function(e){
  e.preventDefault();
  var checks=[["f_first",v("f_first")],["f_last",v("f_last")],["f_de",v("f_de")],["f_city",v("f_city")],["f_mail",v("f_mail").indexOf("@")>0],["f_job",v("f_job")]];
  var firstBad=null;
  checks.forEach(function(c){ var bad=!c[1]; mark($(c[0]),bad); if(bad&&!firstBad) firstBad=$(c[0]); });
  var typ=document.querySelector('input[name=f_type]:checked');
  document.querySelectorAll(".opts .opt").forEach(function(o){mark(o,!typ)});
  if(!typ&&!firstBad) firstBad=document.querySelector('input[name=f_type]');
  if(firstBad){ $("err").textContent=T[lang].errReq; try{firstBad.focus()}catch(x){} return; }
  $("err").textContent="";
  pixelOnce("Lead",{content_name:v("f_job")}); pixelOnce("Contact",{content_name:"form"});
  var msg=buildMessage(), href=waHref(msg);
  $("prevMsg").textContent=msg; $("waLink").href=href;
  $("order").style.display="none"; $("done").classList.add("on");
  try{ window.open(href,"_blank","noopener"); }catch(x){}
});
document.querySelectorAll(".leadform input,.leadform select,.leadform textarea").forEach(function(el){
  function clr(){ el.classList.remove("bad"); if(el.name==="f_type") document.querySelectorAll(".opts .opt").forEach(function(o){o.classList.remove("bad")}); }
  el.addEventListener("input",clr); el.addEventListener("change",clr);
});
$("copyMsg").addEventListener("click",function(){
  var b=this, m=$("prevMsg").textContent;
  try{ navigator.clipboard.writeText(m).then(function(){b.textContent=T[lang].copied; setTimeout(function(){b.textContent=T[lang].copy},1500)},function(){var r=document.createRange(); r.selectNodeContents($("prevMsg")); var s=getSelection(); s.removeAllRanges(); s.addRange(r)}) }catch(e){}
});
document.querySelectorAll("input[name=f_type]").forEach(function(r){r.addEventListener("change",updJob)});
$("f_nocv").addEventListener("change",function(){$("nocvBox").hidden=!this.checked});
/* Meta Pixel: one Lead (+ one Contact) per visitor per 24 h (no-op until the TheBewerbung+ pixel is added in <head>) */
var _sent={};
function pixelOnce(ev,params){
  if(_sent[ev]) return; _sent[ev]=1;
  try{ var k="tbp-"+ev, t=+localStorage.getItem(k)||0; if(Date.now()-t<864e5) return; localStorage.setItem(k,String(Date.now())); }catch(x){}
  try{ if(window.fbq) fbq("track",ev,params); }catch(x){}
}
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[href*='wa.me'],a.wa");
  if(!a) return;
  pixelOnce("Lead",{content_name:"whatsapp_click"});
  pixelOnce("Contact",{content_name:"whatsapp_click"});
},true);
(function(){
  var fl=document.querySelector(".float"), box=$("infos");
  if(fl&&box&&"IntersectionObserver" in window){
    new IntersectionObserver(function(en){ fl.classList.toggle("off",en[0].isIntersecting); },{threshold:0}).observe(box);
  }
  function ready(){
    var ok=["f_first","f_last","f_de","f_city","f_job"].every(function(i){return v(i)})&&v("f_mail").indexOf("@")>0&&!!document.querySelector("input[name=f_type]:checked");
    $("send").classList.toggle("ready",ok);
  }
  document.querySelectorAll(".leadform input,.leadform select").forEach(function(el){el.addEventListener("input",ready);el.addEventListener("change",ready)});
})();
apply();
</script>
</body>
</html>
